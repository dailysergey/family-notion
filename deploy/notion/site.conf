server {
    listen 80;
    server_name notion.sguskov.com;
    include /etc/nginx/conf.d/include/letsencrypt-acme-challenge.conf;
    location / { return 301 https://notion.sguskov.com$request_uri; }
}
map $http_upgrade $notion_connection {
    default upgrade;
    '' close;
}
server {
    listen 443 ssl;
    server_name notion.sguskov.com;
    ssl_certificate /data/custom_ssl/notion/fullchain.pem;
    ssl_certificate_key /data/custom_ssl/notion/privkey.pem;
    client_max_body_size 128m;

    location = /.well-known/oauth-authorization-server/realms/siyuan {
        set $notes_id_metadata notion-id:8080;
        proxy_pass http://$notes_id_metadata/realms/siyuan/.well-known/oauth-authorization-server;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ^~ /notion-brand/ { alias /data/nginx/custom/notion/public/; }
    location ~ ^/appearance/langs/(ru|en)\.json$ {
        alias /data/nginx/custom/notion/langs/$1.json;
        default_type application/json;
        gzip_static on;
        gzip_vary on;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        alias /data/nginx/custom/notion/public/manifest.webmanifest;
    }
    location = /favicon.ico { alias /data/nginx/custom/notion/public/favicon.ico; }
    location = /apple-touch-icon.png { alias /data/nginx/custom/notion/public/note-180.png; }
    location = /mcp {
        set $notes_mcp notion-mcp:8080;
        proxy_pass http://$notes_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location ~ ^/\.well-known/oauth-protected-resource(?:/mcp)?$ {
        default_type application/json;
        return 200 '{"resource":"https://notion.sguskov.com/mcp","authorization_servers":["https://notion.sguskov.com/realms/siyuan"],"scopes_supported":["siyuan.read","siyuan.write"]}';
    }
    location ~ ^/(?:realms/siyuan/|resources/) {
        set $notes_identity notion-id:8080;
        proxy_pass http://$notes_identity;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /api/ai/agent/chat {
        set $notion_upstream siyuan:6806;
        proxy_pass http://$notion_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $notion_connection;
        proxy_buffering off;
        gzip off;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 3600s;
    }

    location / {
        set $notion_upstream siyuan:6806;
        proxy_pass http://$notion_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $notion_connection;
        proxy_read_timeout 3600s;
    }
}
